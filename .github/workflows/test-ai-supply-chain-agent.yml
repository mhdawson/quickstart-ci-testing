name: Test - AI Supply Chain Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 04:00 UTC

concurrency:
  group: quickstart-ci-tests
  cancel-in-progress: false

jobs:
  test:
    name: ai-supply-chain-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"
          python-version: "3.12"

      - uses: ./.github/actions/setup-and-deploy
        timeout-minutes: 15
        with:
          repo_url: https://github.com/rh-ai-quickstart/ai-supply-chain-agent
          ref: main
          submodules: 'true'
          setup_commands: "cp helm/secrets.example.yaml helm/secrets.yaml"
          deploy_command: "make install-full"
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
          PROD_SERVER: ${{ secrets.PROD_SERVER }}
          MODEL_ID: ${{ vars.LLM_ID_INFERENCE_SCOUT }}
          MODEL_URL: ${{ vars.LLM_URL_INFERENCE_SCOUT }}
          API_KEY: ${{ secrets.LLM_API_TOKEN_INFERENCE_SCOUT }}
          # This namespace is pre-provisioned for the CI service account.
          HELM_CREATE_NAMESPACE: ""

      - uses: ./.github/actions/run-quickstart-tests
        timeout-minutes: 30
        with:
          test_command: "RUN_MODEL_E2E=1 make e2e-ui"
          upload_results: "test-results"

      - uses: ./.github/actions/cleanup
        if: always()
        with:
          cleanup_command: "make helm-uninstall"
