name: Test - AI Virtual Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 02:00 UTC

concurrency:
  group: quickstart-ci-tests
  cancel-in-progress: false

jobs:
  test:
    name: ai-virtual-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-and-deploy
        timeout-minutes: 60
        with:
          repo_url: https://github.com/rh-ai-quickstart/ai-virtual-agent
          deploy_command: "make -C deploy/cluster SHELL=/bin/bash install-e2e-openshift"
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
          PROD_SERVER: ${{ secrets.PROD_SERVER }}
          LLM: ${{ vars.LLM_INFERENCE_SCOUT }}
          LLM_ID: ${{ vars.LLM_ID_INFERENCE_SCOUT }}
          LLM_URL: ${{ vars.LLM_URL_INFERENCE_SCOUT }}
          LLM_API_TOKEN: ${{ secrets.LLM_API_TOKEN_INFERENCE_SCOUT }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"
          python-version: "3.12"

      - uses: ./.github/actions/run-quickstart-tests
        timeout-minutes: 30
        with:
          test_command: "make -C deploy/cluster test-int"

      - uses: ./.github/actions/cleanup
        if: always()
        with:
          cleanup_command: "make -C deploy/cluster uninstall-e2e-openshift"
